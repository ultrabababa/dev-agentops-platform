[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devagentops"
version = "0.1.0"
description = "Evaluation-driven Agent Runtime and formal evaluation platform for CI/Test failure triage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "bm25s==0.3.10",
    "fastapi>=0.141,<1",
    "Jinja2==3.1.6",
    "SQLAlchemy>=2.0,<3",
    "tokenizers>=0.22,<1",
    "uvicorn>=0.52,<1",
]

[project.urls]
Homepage = "https://devagentops.onrender.com"
Repository = "https://github.com/ultrabababa/dev-agentops-platform"

[tool.setuptools.package-data]
devagentops = ["assets/*.json", "assets/*.jinja", "assets/*.txt"]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<10",
]

[project.scripts]
devagentops = "devagentops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
