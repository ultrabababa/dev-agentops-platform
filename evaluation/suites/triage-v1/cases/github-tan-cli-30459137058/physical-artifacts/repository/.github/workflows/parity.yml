# SPDX-License-Identifier: Apache-2.0
#
# ADR-0020 (alp-sdk#855 amendment) two-seam parity gate + cross-repo trigger.
# See tests/parity/README.md for the full rationale (oracle SHA, the
# checkout-root/sdkCommit normalization, the allowed debug.probe delta).
#
#   seam1-plan-shape : live `--emit build-plan` vs. the frozen oracle,
#                       toolchain-free. Implemented.
#   seam2            : materialise + real build + Renode smoke. Implemented.
#                       alp-sdk plans it, TAN executes it, the artefact boots.
#                       The toolchain (west / Zephyr SDK / Renode) installs
#                       in-job on stock ubuntu-latest -- alp-sdk#976 proved
#                       that, retiring this job's old "needs a self-hosted
#                       runner" blocker.
#                       Deliberately builds through `tan build`, NOT plain
#                       `west`: routing around the executor would test Zephyr
#                       and assert nothing about the seam.
#
# Runs on every tan PR as a self-check of this repo's vendored oracle +
# comparator against a pinned alp-sdk ref. (Plan-shape drift on the alp-sdk
# side is caught in alp-sdk's own CI -- alplabai/alp-sdk parity-seam1.yml --
# where it surfaces on the alp-sdk PR itself; no cross-repo dispatch needed.)

name: parity

on:
  pull_request:
  # ADR-0020's cross-repo trigger. alp-sdk fires this on every push that touches
  # its contract surface, and the payload carries the SHA to test against --
  # which is the whole point: a `pull_request` run checks tan against a PINNED
  # alp-sdk, so it cannot see an alp-sdk change that breaks tan until someone
  # bumps the pin by hand. alp-sdk's own `parity-seam1.yml` cannot see it either:
  # that job diffs alp-sdk's emit against alp-sdk's own frozen oracle and never
  # runs tan at all.
  #
  # THIS BLOCK MUST EXIST ON THE DEFAULT BRANCH (#194). GitHub triggers
  # `repository_dispatch` from the DEFAULT branch's copy of a workflow and
  # nowhere else, so while this lived only on `dev`, alp-sdk dispatched
  # successfully and nothing ever ran -- lifetime run count 0, with a 204 and no
  # body on every send. Do not "tidy" it onto a feature branch only.
  repository_dispatch:
    types: [alp-sdk-planner-change]

env:
  # Fallback alp-sdk ref for a plain `pull_request` run (no dispatch payload).
  # It MUST be a ref at or after the oracle SHA (97ad481b) -- an OLDER ref
  # (e.g. the last release v0.11.1, which predates the Phase-1 fields) lacks
  # envAppendPath/executionPolicy and would fail seam1 on missing-field diffs,
  # not real drift. Pinned to an exact alp-sdk `dev` commit SHA rather than a
  # tag: `actions/checkout`'s `ref:` takes any git ref, and a full SHA is
  # exactly as immutable as a tag without waiting on alp-sdk to cut one.
  # Carries the Phase-1 fields, the one allowed delta (debug.probe
  # openocd->null), the tokened-plan reconciliation branch `normalize_plan`
  # exercises, alp-sdk#893/#894/#897 (the `--emit kconfig` fixture), and
  # alp-sdk#917/#928 (the `metadata/bootstrap.json` manifest + its
  # `manualInstallHints` split). Bumped past #917 to alp-sdk#961 (Arm-toolchain
  # scoping, merged a27757b8f654b2d8d32a1a2a3f3ce640e9bade0c) and #967
  # (dtc/gperf settled, merged at this very SHA), which together rewrote
  # `manualInstallHints.windows.note` from one sentence to five elements and
  # bumped `zephyr.version` to v4.4.1 -- the re-vendor that let tan-cli#82
  # delete `optional_libs_block`'s duplicate hardcoded Arm/Zephyr-SDK block.
  # Bootstrap manifest is 5473 bytes at this SHA (was 3180) and its byte-parity
  # step is verified PASS locally against it; the kconfig / scaffold / seam1
  # steps were verified at the previous SHA and are NOT re-verified at this one
  # (they need an emit-capable Linux runner), so this bump is the first CI run
  # that proves them here. Re-bump (to a released tag once alp-sdk cuts one at
  # or after this SHA, or straight to a later SHA) on every alp-sdk change this
  # repo's parity gate should track.
  PINNED_SDK_TAG: cdfe13684e362c75f6df2b190ec1c3e736c48731

jobs:
  seam1-plan-shape:
    name: "seam1 -- plan-shape parity"
    runs-on: ubuntu-latest
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@v4
        with:
          # On a `repository_dispatch` the workflow FILE has to come from the
          # DEFAULT branch -- that is GitHub's rule and why #195 put the trigger
          # on `main`. But what we CHECK OUT and test is a separate choice, and
          # the default (`main`) is the wrong one here.
          #
          # Everything that tracks alp-sdk lands on `dev`: the vendored scaffold
          # fixtures, PINNED_SDK_TAG, the comparator. `main` only receives them
          # at a release. So testing `main` against the newest alp-sdk is red for
          # the entire interval between releases, and its redness says nothing
          # actionable -- it reports "the last release predates this SDK change",
          # which is true by construction and not a defect.
          #
          # The question worth asking on a dispatch is "can tan's integration
          # branch consume this alp-sdk change?", so test `dev`. A `pull_request`
          # run keeps checkout's default (the PR head) by passing an empty ref.
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || '' }}

      - name: resolve alp-sdk ref
        id: sdk_ref
        shell: bash
        run: |
          # A dispatch carries the alp-sdk SHA that just landed; a plain PR run
          # has no payload and falls back to the pin. Written as one expression
          # so the two paths cannot drift apart.
          ref='${{ github.event.client_payload.sdk_ref || env.PINNED_SDK_TAG }}'
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.client_payload.sdk_ref }}" ]; then
            echo "::notice::DISPATCHED by alp-sdk -- comparing against the ref that just landed: ${ref}"
          else
            echo "::notice::comparing against the pinned alp-sdk ref: ${ref}"
          fi

      - name: clone alp-sdk
        uses: actions/checkout@v4
        with:
          repository: alplabai/alp-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: alp-sdk

      # ADR-0020 mandates a `repository_dispatch` alp-sdk -> tan on every planner
      # change. That needs a PAT/App secret this repo does not have, so the pin
      # is bumped by hand -- and a hand-bumped pin ROTS SILENTLY. The gate stays
      # green against a months-old alp-sdk while `dev` moves underneath it, which
      # is the exact "green means nothing" failure the two-seam gate exists to
      # prevent.
      #
      # This is the token-free half: no dispatch, but the pin cannot drift
      # unnoticed. alp-sdk is public, so the default GITHUB_TOKEN reads it.
      #
      # WARN, never fail. A pin legitimately lags -- an alp-sdk change the
      # planner did not touch should not red every tan PR, and a gate that
      # reddens for something the author cannot fix in their own PR is a gate
      # people learn to ignore. What it must never do is stay quiet.
      # Skipped on a dispatch run: that run deliberately IGNORES the pin and
      # tests the ref alp-sdk just pushed, so reporting the pin as stale would
      # describe something this run did not use. The dispatch is the thing that
      # makes the pin matter less; the warning stays for PR runs, which still
      # depend on it entirely.
      - name: pin freshness (warn only)
        if: ${{ github.event_name != 'repository_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          pinned='${{ env.PINNED_SDK_TAG }}'
          head="$(gh api repos/alplabai/alp-sdk/commits/dev -q .sha 2>/dev/null || true)"
          if [ -z "${head}" ]; then
            echo "::warning::could not read alp-sdk dev to check pin freshness -- skipping this check only"
            exit 0
          fi
          if [ "${head}" = "${pinned}" ]; then
            echo "pin is alp-sdk dev tip (${pinned}) -- fresh."
            exit 0
          fi
          # Count only commits touching the CONTRACT surface. Total commit count
          # would flag a docs-only week and train everyone to ignore the warning.
          cd alp-sdk
          git fetch -q --depth=200 origin dev || true
          behind="$(git rev-list --count "${pinned}..origin/dev" --                       scripts/alp_orchestrate metadata tests/parity 2>/dev/null || echo '?')"
          if [ "${behind}" = "0" ]; then
            echo "pin is behind alp-sdk dev, but by NOTHING on the contract surface. Fine."
            exit 0
          fi
          echo "::warning::PINNED_SDK_TAG is ${behind} contract-surface commit(s) behind alp-sdk dev (${head}). Both seams are green against a pin that no longer reflects the planner. Re-bump PINNED_SDK_TAG in .github/workflows/parity.yml."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # alp_orchestrate's emit path hard-requires PyYAML and jsonschema (it
      # aborts with "<pkg> is required" otherwise). setup-python ships a bare
      # interpreter, so install them explicitly — without this, seam1 fails
      # every example with an emit error, not a real plan-shape diff. `pytest`
      # runs the comparator's own unit tests, below.
      - name: install SDK emit + test deps
        run: python3 -m pip install --upgrade pip pyyaml jsonschema pytest

      # The comparator judges every live alp-sdk emit against the frozen
      # oracle -- a broken comparator (e.g. a tolerance that silently waves
      # through a dropped command) must be caught here, before it is trusted
      # to judge alp-sdk below.
      - name: seam1 comparator self-test (test_seam1_field_diff.py)
        run: python3 -m pytest tests/parity/test_seam1_field_diff.py -q

      - name: seam1 field diff (live emit vs. frozen oracle)
        run: >
          python3 tests/parity/seam1_field_diff.py
          --sdk alp-sdk
          --oracle tests/parity/oracle

      - name: kconfig fixture byte-parity (vendored vs. pinned alp-sdk)
        run: python3 tests/parity/kconfig_fixture_parity.py --sdk alp-sdk

      # `tan bootstrap` reads the SDK's metadata/bootstrap.json (alp-sdk#917)
      # and falls back to hand-ported constants for an SDK without one.
      # alp-sdk's own check_bootstrap_manifest.py polices its two shell
      # scripts against that manifest but cannot see this checkout, so this
      # is the tan-side half of that gate. PINNED_SDK_TAG is now past #917
      # (and #928), so this step byte-diffs for real -- same milestone the
      # kconfig step passed once its pin moved past #897.
      - name: bootstrap manifest byte-parity (vendored vs. pinned alp-sdk)
        run: python3 tests/parity/bootstrap_manifest_parity.py --sdk alp-sdk

      # `tan doctor`'s zephyrSdk check (tan-cli#160) prints a hand-ported copy
      # of alp-sdk's metadata/toolchains.json zephyrSdk.version
      # (crates/tan-core/src/host_env.rs::ZEPHYR_SDK_INSTALL_VERSION).
      # scripts/check_toolchain_lock.py guards every CI *workflow* copy of
      # that pin but cannot see this checkout (tan-cli#172) -- this is the
      # tan-side half, reusing this job's alp-sdk checkout rather than a
      # second clone.
      - name: toolchain lock byte-parity (vendored vs. pinned alp-sdk)
        run: python3 tests/parity/toolchain_lock_parity.py --sdk alp-sdk

      # Vendored wizard scaffold tree vs. the pinned alp-sdk's live
      # `--emit scaffold`. Reuses this job's alp-sdk checkout + emit deps (same
      # as the kconfig step above) rather than a second clone. The vendored tree
      # is captured at this exact pin, so a re-vendor that drifts from the SDK
      # fails here instead of shipping silently (the drift that hid the stale
      # `minimal` README before this gate ran in CI).
      - name: scaffold byte-parity (vendored tree vs. pinned alp-sdk --emit scaffold)
        run: python3 tests/parity/scaffold_byte_parity.py --sdk alp-sdk

  # seam2 -- the half of ADR-0020's parity contract seam1 cannot reach.
  #
  # seam1 proves the PLAN's SHAPE is stable. It never runs tan and never
  # compiles anything, so it cannot catch an executor that reads a correct plan
  # and does the wrong thing with it. seam2 closes that: alp-sdk plans it, TAN
  # executes it, and the artefact is booted.
  #
  # Note the deliberate difference from alp-sdk's own pr-renode-aen-smoke.yml,
  # which this borrows its toolchain recipe from: that job builds with plain
  # `west`, because it is testing alp-sdk's board files. Here the build MUST go
  # through `tan build` -- routing around tan would test Zephyr and assert
  # nothing about the seam.
  #
  # This was a documented no-op placeholder until now, on the stated grounds
  # that it "needs a Linux runner with the toolchain installed". alp-sdk#976
  # disproved that: the Zephyr SDK and Renode both install on a stock
  # ubuntu-latest runner in-job. The blocker had expired.
  seam2:
    name: "seam2 -- materialise + real build + Renode smoke"
    runs-on: ubuntu-latest
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@v4
        with:
          # On a `repository_dispatch` the workflow FILE has to come from the
          # DEFAULT branch -- that is GitHub's rule and why #195 put the trigger
          # on `main`. But what we CHECK OUT and test is a separate choice, and
          # the default (`main`) is the wrong one here.
          #
          # Everything that tracks alp-sdk lands on `dev`: the vendored scaffold
          # fixtures, PINNED_SDK_TAG, the comparator. `main` only receives them
          # at a release. So testing `main` against the newest alp-sdk is red for
          # the entire interval between releases, and its redness says nothing
          # actionable -- it reports "the last release predates this SDK change",
          # which is true by construction and not a defect.
          #
          # The question worth asking on a dispatch is "can tan's integration
          # branch consume this alp-sdk change?", so test `dev`. A `pull_request`
          # run keeps checkout's default (the PR head) by passing an empty ref.
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || '' }}

      - name: resolve alp-sdk ref
        id: sdk_ref
        shell: bash
        run: |
          set -euo pipefail
          ref='${{ github.event.client_payload.sdk_ref || env.PINNED_SDK_TAG }}'
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.client_payload.sdk_ref }}" ]; then
            echo "::notice::seam2 DISPATCHED by alp-sdk -- building against the ref that just landed: ${ref}"
          else
            echo "::notice::seam2 building against the pinned alp-sdk ref: ${ref}"
          fi

      - name: clone alp-sdk
        uses: actions/checkout@v4
        with:
          repository: alplabai/alp-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: alp-sdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: host deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              ninja-build device-tree-compiler gperf ca-certificates curl gnupg xz-utils

      - name: west + SDK python deps
        run: python3 -m pip install --upgrade pip west pyyaml jsonschema pyelftools

      # `tan generate` live-run e2e (tan-cli#113 + the SoM-swap regression
      # test for PR #157's output-directory bug): spawns the REAL
      # `alp_project.py` from the checkout above (already pinned to
      # PINNED_SDK_TAG by the `clone alp-sdk` step) and asserts what actually
      # lands on disk -- `zephyr-board`/`west-libraries`/`hw-info-h`, the
      # SoM-swap non-collision case, `--core` forwarded vs. refused, and the
      # ValidationFailure(2)-not-InternalFailure(5) exit-code mapping. Needs
      # only python + the SDK checkout + the pyyaml/jsonschema deps the step
      # above just installed (no Zephyr SDK/west workspace/Renode, no
      # separate `cargo build` -- `cargo test` builds the tan binary itself),
      # so it genuinely runs BEFORE those -- placed here, not after them, so a
      # Renode CDN hiccup or a Zephyr-SDK sha256 mismatch downstream can never
      # cost the PR this coverage (tan-cli#158 review finding 4: an earlier
      # revision of this step made this same claim in its comment while
      # sitting after all three installs). `TAN_LIVE_RUN_SDK_ROOT` pointed at
      # THIS job's own pinned `alp-sdk/` checkout is what lets the suite
      # inherit the pin by construction rather than a second hardcoded SHA --
      # see `crates/tan-cli/tests/live_run_generate.rs`'s module docs.
      # `TAN_LIVE_RUN_REQUIRED=1` is what makes a missing root here a hard
      # panic instead of a quiet skip -- this is the one job that wires the
      # root, so absence here means the wiring broke, not "not applicable"
      # (deliberately not keyed off the generic `CI` var: this repo's own
      # `ci.yml` `test` job also runs under `CI=true` with neither var set,
      # and gating on `CI` alone made that unrelated job hard-panic instead
      # of skipping -- tan-cli#158 review finding 1).
      - name: generate live-run e2e (tan generate vs pinned alp-sdk)
        env:
          TAN_LIVE_RUN_SDK_ROOT: ${{ github.workspace }}/alp-sdk
          TAN_LIVE_RUN_REQUIRED: "1"
        run: cargo test --locked -p alp-tan-cli --test live_run_generate

      # Zephyr itself. `west init -l` against alp-sdk's own manifest is what a
      # customer's `tan bootstrap` does, so the tree under test is the pinned
      # one rather than whatever Zephyr happens to be newest.
      - name: west workspace (alp-sdk manifest)
        run: |
          set -euo pipefail
          west init -l alp-sdk
          west update --narrow -o=--depth=1
          west zephyr-export

      # Single source for the SDK pin, same read alp-sdk's own renode job does
      # (metadata/toolchains.json, gated by check_toolchain_lock.py).
      - name: read Zephyr SDK pin
        run: |
          set -euo pipefail
          # Bind to plain locals before formatting. Inlining the subscripts as
          # f"...{sdk[\"version\"]}..." needs backslash escapes inside the
          # f-string expression, which is a SyntaxError -- and it is what broke
          # this step on its first run. alp-sdk's pr-renode-aen-smoke.yml has
          # this exact shape for this exact reason; do not re-compress it.
          python3 -c '
          import json
          d = json.load(open("alp-sdk/metadata/toolchains.json"))
          sdk = d["zephyrSdk"]
          art = next(a for a in sdk["artifacts"]
                     if a["host"] == "linux-x86_64" and a["component"] == "minimal-sdk")
          version = sdk["version"]
          url = sdk["baseUrl"] + art["filename"]
          sha256 = art["sha256"]
          print(f"ZEPHYR_SDK_VERSION={version}")
          print(f"ZEPHYR_SDK_URL={url}")
          print(f"ZEPHYR_SDK_SHA256={sha256}")
          ' >> "$GITHUB_ENV"

      - name: install Zephyr SDK (arm-zephyr-eabi)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zephyr-sdk.tar.xz "${ZEPHYR_SDK_URL}"
          ACTUAL="$(sha256sum /tmp/zephyr-sdk.tar.xz | awk '{print $1}')"
          if [ "${ACTUAL}" != "${ZEPHYR_SDK_SHA256}" ]; then
            echo "::error::Zephyr SDK sha256 mismatch: expected ${ZEPHYR_SDK_SHA256}, got ${ACTUAL}"
            exit 1
          fi
          mkdir -p "$HOME/zephyr-sdk"
          tar -xJf /tmp/zephyr-sdk.tar.xz -C "$HOME/zephyr-sdk" --strip-components=1
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      # v1.16.1 portable-dotnet: self-contained .NET, no Mono/GTK# system deps.
      # The .deb needs gtk-sharp2/*-cil-dev packages ubuntu-24.04 dropped.
      - name: install Renode
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz \
              -o /tmp/renode.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf /tmp/renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
          "$HOME/renode/renode" --version

      - name: build tan
        run: cargo build --locked --bin tan

      # ---- the seam itself -------------------------------------------------

      # 1. MATERIALISE. tan reads alp-sdk's `--emit build-plan` and writes the
      #    per-slice artefacts. Failing here means the plan and the executor
      #    disagree about the plan's own contents -- the drift seam1 is blind to.
      # `build --materialise` is the primitive seam2's own definition names:
      # "consume the plan, write its generated files (shared artefacts +
      # per-slice config) to disk". Not `generate`, which emits a single target
      # rather than the plan's whole artefact set.
      #
      # Verified locally against alp-sdk 3ffd8774 before this landed -- it needs
      # no toolchain, so it is the one seam2 stage reproducible off-runner:
      #   ok=true, data.written = [build/generated/alp/system_ipc.h,
      #   build/generated/dts-reservations.dtsi, build/generated/dts-partitions.dtsi,
      #   build/a32_cluster-yocto/local.conf, build/m55_he-zephyr/alp.conf,
      #   build/m55_hp-zephyr/alp.conf]
      - name: materialise (tan build --materialise)
        working-directory: alp-sdk/examples/peripheral-io/hello-world
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/target/debug/tan" \
              --sdk-root "${GITHUB_WORKSPACE}/alp-sdk" \
              --format json build --materialise > /tmp/seam2-materialise.json
          python3 -c '
          import json, sys
          e = json.load(open("/tmp/seam2-materialise.json"))
          if not e.get("ok"):
              print("::error::seam2 materialise: tan reported not-ok:",
                    json.dumps(e.get("issues"), indent=2))
              sys.exit(1)
          written = (e.get("data") or {}).get("written") or []
          if not written:
              print("::error::seam2 materialise: `data.written` is empty -- tan "
                    "reported success having produced no artefacts. An empty "
                    "write list is exactly the silent-pass shape this seam exists "
                    "to catch, so it is a failure here, not a pass.")
              sys.exit(1)
          print("materialised", len(written), "artefacts:")
          for w in written: print("   ", w)
          '

      # 2. REAL BUILD, through tan. Not `west` -- routing around the executor
      #    would test Zephyr and assert nothing about the seam.
      - name: real build (tan build)
        working-directory: alp-sdk/examples/peripheral-io/hello-world
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/target/debug/tan" \
              --sdk-root "${GITHUB_WORKSPACE}/alp-sdk" \
              build --native 2>&1 | tee /tmp/seam2-build.log
          # `tee` would mask a non-zero tan exit without this; the whole point
          # of the job is that a failed build fails the gate.
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::seam2 real build: tan build exited ${rc}."
            exit "$rc"
          fi

      # 3. The artefact must EXIST. `tan build` reporting ok while producing no
      #    ELF is exactly the #97 defect class, one layer up.
      # Pick the M55-HP slice EXPLICITLY. `-print -quit` takes whichever slice
      # `find` reaches first, which on the first run was m55_he -- then booted
      # against a descriptor written for the HP core. The descriptor decides
      # which artefact is meaningful here, so the selection cannot be
      # whichever-comes-first.
      - name: locate the built ELF (m55_hp slice)
        run: |
          set -euo pipefail
          BUILD="${GITHUB_WORKSPACE}/alp-sdk/examples/peripheral-io/hello-world/build"
          ELF="${BUILD}/m55_hp-zephyr/build/zephyr/zephyr.elf"
          if [ ! -f "${ELF}" ]; then
            echo "::error::seam2: tan build reported success but produced no ${ELF}. Tree:"
            find "${BUILD}" -maxdepth 3 -type d || true
            find "${BUILD}" -name 'zephyr.elf' || true
            exit 1
          fi
          file "${ELF}"
          # A host x86-64 binary here is the #97 defect reaching the artefact.
          if ! file "${ELF}" | grep -q "ARM"; then
            echo "::error::seam2: ${ELF} is not an ARM image -- a zephyr slice produced a host binary."
            exit 1
          fi
          echo "SEAM2_ELF=${ELF}" >> "$GITHUB_ENV"

      # 4. RENODE SMOKE. Same three assertions alp-sdk#974/#976 established, on
      #    the artefact TAN produced rather than one west produced.
      - name: Renode boot smoke
        run: |
          set -euo pipefail
          LOG=/tmp/seam2-renode.log
          # `$repl` MUST be passed. The .resc defaults it to the RELATIVE path
          # `metadata/renode/alif_ensemble_e8.repl`, which only resolves when
          # renode's cwd is the alp-sdk root. Omitting it on the first run gave
          #   Could not find file 'metadata/renode/alif_ensemble_e8.repl'
          # and then the absent-PC assertion fired -- a real failure, but for a
          # harness reason rather than the boot reason it is meant to report.
          set +e
          "$HOME/renode/renode" --console --disable-xwt --plain \
              -e "\$repl=@${GITHUB_WORKSPACE}/alp-sdk/metadata/renode/alif_ensemble_e8.repl" \
              -e "\$elf=@${SEAM2_ELF}" \
              -e "i @${GITHUB_WORKSPACE}/alp-sdk/metadata/renode/alif_ensemble_e8.resc" \
              -e "quit" > "${LOG}" 2>&1
          RC=$?
          set -e
          echo "----- renode log -----"; cat "${LOG}"
          if [ "$RC" -ne 0 ]; then
            echo "::error::seam2 Renode smoke: renode exited ${RC}."
            exit 1
          fi
          # Renode exits 0 even when a monitor command fails -- the first run
          # here failed to load the .repl and still returned 0, so the exit code
          # alone is not a verdict. Catch the harness failure by name, before
          # the boot assertions, or a broken setup reports itself as a boot
          # failure and sends the next reader after the wrong thing.
          if grep -qE "There was an error executing command|Could not find file" "${LOG}"; then
            echo "::error::seam2 Renode smoke: a monitor command failed (renode still exited 0) -- this is a HARNESS failure, not a boot failure. First offending line:"
            grep -m1 -E "There was an error executing command|Could not find file" "${LOG}"
            exit 1
          fi
          if ! grep -q "Setting initial values: PC = 0x" "${LOG}"; then
            echo "::error::seam2 Renode smoke: 'Setting initial values: PC = 0x' absent -- the vector table was never seeded."
            exit 1
          fi
          if grep -q "CPU was halted" "${LOG}"; then
            echo "::error::seam2 Renode smoke: 'CPU was halted' -- the PC/SP seed was unusable."
            exit 1
          fi
          if grep -q "Guessing VectorTableOffset value to be 0x" "${LOG}"; then
            echo "::error::seam2 Renode smoke: Renode fell back to inferring VectorTableOffset (the condition alp-sdk#947 exists to eliminate)."
            exit 1
          fi
          echo "seam2: materialise -> tan build -> ARM ELF -> Renode boot, all asserted."

      - name: upload seam2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seam2-logs
          path: |
            /tmp/seam2-materialise.json
            /tmp/seam2-build.log
            /tmp/seam2-renode.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # tan-cli#A6: until this job existed, NO workflow in either repo ran `tan
  # bootstrap`, `tan init` or `tan build` at all -- grepping .github for them
  # returned three COMMENT lines and no `run:` step. seam2 above hand-assembles
  # the workspace itself (`west init -l` / `west update` / `west zephyr-export`)
  # and then builds an EXISTING example, so it exercises the loader seam but
  # never the commands a customer actually types. Every regression in the venv
  # phase, the west phase, the prerequisite gate or the workspace guard reached
  # customers with a green board.
  #
  # This job is the customer path and nothing else: bootstrap -> doctor ->
  # init -> build, in that order, on a machine that starts with none of it.
  first-blink:
    name: "first blink -- tan bootstrap -> init -> build"
    runs-on: ubuntu-latest
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || '' }}

      - name: resolve alp-sdk ref
        id: sdk_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event.client_payload.sdk_ref || env.PINNED_SDK_TAG }}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "::notice::first-blink building against alp-sdk ref: ${ref}"

      # Into `ws/alp-sdk`, NOT `alp-sdk`, and the nesting is load-bearing.
      # `west init -l <checkout>` forces the west topdir to be the checkout's
      # PARENT (alp-sdk#769), so tan-cli#185's workspace guard refuses to
      # bootstrap when that parent holds anything besides the checkout. At
      # $GITHUB_WORKSPACE the parent also holds the whole tan-cli tree, so a
      # flat `path: alp-sdk` would make `tan bootstrap --non-interactive` exit
      # 2 by design. A dedicated parent is what the guard asks for and what
      # README tells customers to do -- this job runs the documented layout.
      - name: clone alp-sdk into a dedicated workspace parent
        uses: actions/checkout@v4
        with:
          repository: alplabai/alp-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: ws/alp-sdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # Deliberately NOT pip-installing west here: `tan bootstrap` creating the
      # venv and installing west into it is one of the things under test.
      # pkg-config + libusb-1.0-0-dev are NOT decoration: this job's own second
      # run proved `hidapi` builds from source inside bootstrap's Zephyr
      # requirements install and fails without them
      # (`Exception: pkg-config package 'libusb-1.0 >= 1.0.9' not found`).
      # bootstrap warns and continues by design, so the workspace looks
      # complete and `tan init` dies later instead. Installing them here keeps
      # the rest of the customer path under test; the warning itself is
      # asserted below, so removing them turns this job red rather than green.
      - name: host deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              ninja-build device-tree-compiler gperf ca-certificates curl xz-utils \
              pkg-config libusb-1.0-0-dev

      - name: build tan
        run: cargo build --locked --bin tan

      # THE STEP THAT DID NOT EXIST. Exit 0 is necessary but not sufficient --
      # a bootstrap that "succeeds" without creating the workspace is exactly
      # the silent failure this job is for, so the artefacts are asserted.
      - name: tan bootstrap (the customer's first command)
        working-directory: ws/alp-sdk
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/target/debug/tan" bootstrap --non-interactive
          for p in ../.west/config ../.venv ../zephyr ../modules; do
            if [ ! -e "$p" ]; then
              echo "::error::tan bootstrap exited 0 but did not create $p"
              exit 1
            fi
          done
          echo "bootstrap created .west/, .venv/, zephyr/ and modules/ in the workspace parent."

      # BEFORE the toolchain exists, doctor must FAIL and must say why. This is
      # the half a customer hits first: bootstrap has just succeeded, and the
      # host still cannot build. Measured on this job's own first run -- doctor
      # exits 4 here, because #159/#166 made a missing Zephyr SDK a hard Fail
      # rather than a warning. Asserting the exit alone would pass for any
      # failing check, so the zephyrSdk row itself is asserted.
      - name: tan doctor reports the missing toolchain (expected to fail)
        working-directory: ws/alp-sdk
        run: |
          set -euo pipefail
          set +e
          "$GITHUB_WORKSPACE/target/debug/tan" doctor --format json \
              > /tmp/first-blink-doctor-before.json
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::doctor exited 0 with no Zephyr SDK installed -- the hard Fail from #159/#166 is gone"
            exit 1
          fi
          python3 -c '
          import json, sys
          d = json.load(open("/tmp/first-blink-doctor-before.json"))
          checks = {c["name"]: c for c in d["data"]["checks"]}
          row = checks.get("zephyrSdk")
          if row is None:
              sys.exit("zephyrSdk missing from checks[]; got: " + ", ".join(sorted(checks)))
          status = row["status"]
          if status != "fail":
              sys.exit("zephyrSdk status is " + status + ", expected fail")
          print("doctor correctly fails on the missing toolchain:", row["detail"])
          '
          echo "doctor exit was ${code} (non-zero), and zephyrSdk is a hard fail."

      # Pinned + sha256-verified, same source of truth as seam2: alp-sdk's own
      # metadata/toolchains.json, never a hardcoded version (see that file's
      # comment on check_toolchain_lock.py).
      - name: read Zephyr SDK pin
        run: |
          set -euo pipefail
          python3 -c '
          import json
          d = json.load(open("ws/alp-sdk/metadata/toolchains.json"))
          sdk = d["zephyrSdk"]
          art = next(a for a in sdk["artifacts"]
                     if a["host"] == "linux-x86_64" and a["component"] == "minimal-sdk")
          version = sdk["version"]
          url = sdk["baseUrl"] + art["filename"]
          sha256 = art["sha256"]
          print(f"ZEPHYR_SDK_VERSION={version}")
          print(f"ZEPHYR_SDK_URL={url}")
          print(f"ZEPHYR_SDK_SHA256={sha256}")
          ' >> "$GITHUB_ENV"

      - name: install Zephyr SDK (arm-zephyr-eabi)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zephyr-sdk.tar.xz "${ZEPHYR_SDK_URL}"
          ACTUAL="$(sha256sum /tmp/zephyr-sdk.tar.xz | awk '{print $1}')"
          if [ "${ACTUAL}" != "${ZEPHYR_SDK_SHA256}" ]; then
            echo "::error::Zephyr SDK sha256 mismatch: expected ${ZEPHYR_SDK_SHA256}, got ${ACTUAL}"
            exit 1
          fi
          mkdir -p "$HOME/zephyr-sdk"
          tar -xJf /tmp/zephyr-sdk.tar.xz -C "$HOME/zephyr-sdk" --strip-components=1
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      # AFTER the install, the same command must now pass. Without this half the
      # job would only prove doctor can fail, never that the remedy it names
      # actually resolves the thing it complained about.
      - name: tan doctor passes once the toolchain is installed
        working-directory: ws/alp-sdk
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/target/debug/tan" doctor --format json \
              > /tmp/first-blink-doctor-after.json
          python3 -c '
          import json, sys
          d = json.load(open("/tmp/first-blink-doctor-after.json"))
          row = {c["name"]: c for c in d["data"]["checks"]}["zephyrSdk"]
          if row["status"] != "pass":
              sys.exit("zephyrSdk still " + row["status"] + " after install: " + row["detail"])
          print("zephyrSdk passes after the pinned install:", row["detail"])
          '

      # `--from-example` is the path tan-cli#164 exists to make discoverable;
      # `peripheral-io/hello-world` is the id that issue names as the one a
      # customer could not find because `tan examples` printed only a count.
      - name: tan init --from-example
        working-directory: ws
        run: |
          set -euo pipefail
          # `--sdk-root alp-sdk` is passed explicitly, and that is a FINDING,
          # not a preference. Run from the workspace topdir with `alp-sdk/`
          # sitting right there, `tan init` still reports "alp-sdk root is
          # unresolved" -- bootstrap records the SDK only at
          # `.west/tan-workspace-sdk` (its own staleness marker,
          # west_config.rs:133), never as the `.alp/sdk-path` pointer that
          # resolution actually reads, and A5's global pointer is written only
          # on a RELOCATION, which a clean parent never triggers. README's own
          # flow passes `--sdk-root ./alp-sdk` to bootstrap, so this matches
          # documented usage -- but the documented NEXT step does not resolve
          # on its own. Tracked separately; drop this flag once it does.
          "$GITHUB_WORKSPACE/target/debug/tan" init \
              --from-example peripheral-io/hello-world \
              --sdk-root alp-sdk \
              --name my-app --non-interactive
          test -f my-app/board.yaml || { echo "::error::tan init wrote no board.yaml"; exit 1; }

      - name: tan build
        working-directory: ws/my-app
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/target/debug/tan" build 2>&1 | tee /tmp/first-blink-build.log
          echo "first blink: bootstrap -> doctor -> init -> build, all from the commands a customer types."

      - name: upload first-blink logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-blink-logs
          path: |
            /tmp/first-blink-doctor-before.json
            /tmp/first-blink-doctor-after.json
            /tmp/first-blink-build.log
          if-no-files-found: warn
